<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clima en tiempo real</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3c72">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root {
      --fondo-1: #1e3c72;
      --fondo-2: #2a5298;
      --texto: #ffffff;
      --tarjeta: rgba(255, 255, 255, 0.12);
      --borde: rgba(255, 255, 255, 0.25);
    }
    body.claro {
      --fondo-1: #bfdbfe;
      --fondo-2: #fde68a;
      --texto: #1e293b;
      --tarjeta: rgba(255, 255, 255, 0.65);
      --borde: rgba(0, 0, 0, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, var(--fondo-1), var(--fondo-2));
      color: var(--texto);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      transition: background 0.8s, color 0.5s;
    }
    #fondo {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .tarjeta {
      position: relative;
      z-index: 1;
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 460px;
      margin: 60px 0 20px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(12px);
    }
    h1 { font-size: 1.5em; margin-top: 0; }
    form { display: flex; gap: 8px; margin-bottom: 10px; }
    input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 1em;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #ffb703;
      color: #222;
      font-weight: bold;
      cursor: pointer;
    }
    .secundario {
      width: 100%;
      margin-bottom: 16px;
      background: var(--tarjeta);
      color: var(--texto);
      border: 1px solid var(--borde);
    }
    .boton-tema {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 2;
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 50%;
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      font-size: 1.2em;
    }
    .favoritos {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .favoritos:empty { display: none; }
    .chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      color: var(--texto);
      border-radius: 20px;
      padding: 6px 10px;
      font-size: 0.85em;
      cursor: pointer;
    }
    .chip .quitar {
      background: none;
      color: var(--texto);
      padding: 0 2px;
      font-size: 0.9em;
      opacity: 0.7;
    }
    .icono { font-size: 4em; margin: 5px 0; }
    .temperatura { font-size: 3.5em; font-weight: bold; margin: 5px 0; }
    .mensaje { margin-top: 12px; font-weight: bold; font-size: 1.05em; }
    .detalle { display: flex; justify-content: space-around; margin-top: 20px; }
    .actualizado { font-size: 0.85em; opacity: 0.8; margin-top: 16px; }
    .error { color: #dc2626; }
    body:not(.claro) .error { color: #ffb4b4; }
    .titulo-pronostico { margin-top: 24px; margin-bottom: 8px; font-size: 1em; opacity: 0.9; }
    .pronostico { display: flex; gap: 6px; }
    .dia {
      flex: 1;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 8px 2px;
      font-size: 0.8em;
    }
    .dia .icono-pequeno { font-size: 1.6em; margin: 4px 0; }
    .horas {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
    }
    .hora {
      flex: 0 0 58px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 6px 2px;
      font-size: 0.8em;
    }
    .hora .icono-pequeno { font-size: 1.5em; margin: 4px 0; }

    /* Animaciones del fondo según el clima */
    .sol {
      position: absolute;
      top: -180px;
      right: -180px;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 200, 0, 0.7), rgba(255, 200, 0, 0) 70%);
      animation: pulso 5s ease-in-out infinite;
    }
    @keyframes pulso { 50% { transform: scale(1.12); } }
    .nube {
      position: absolute;
      top: 12%;
      left: -260px;
      width: 260px;
      height: 80px;
      border-radius: 60px;
      background: rgba(255, 255, 255, 0.35);
      filter: blur(3px);
      animation: viajar 35s linear infinite;
    }
    @keyframes viajar { to { transform: translateX(calc(100vw + 300px)); } }
    .niebla {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      animation: vaiven 10s ease-in-out infinite alternate;
    }
    @keyframes vaiven {
      from { transform: translateX(-40%); }
      to { transform: translateX(40%); }
    }
    .gota {
      position: absolute;
      top: -80px;
      width: 2px;
      height: 70px;
      background: linear-gradient(transparent, rgba(180, 220, 255, 0.8));
      animation: caer linear infinite;
    }
    .copo {
      position: absolute;
      top: -20px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      animation: caer linear infinite;
    }
    @keyframes caer { to { transform: translateY(calc(100vh + 120px)); } }
    .relampago {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      animation: destello 7s infinite;
    }
    @keyframes destello {
      0%, 92%, 100% { opacity: 0; }
      93% { opacity: 0.5; }
      94% { opacity: 0; }
      96% { opacity: 0.35; }
      97% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="fondo"></div>
  <button id="cambiarTema" class="boton-tema" title="Cambiar tema">🌙</button>

  <div class="tarjeta">
    <h1>🌤️ Clima en tiempo real</h1>
    <form id="formulario">
      <input type="text" id="ciudad" placeholder="Escribe una ciudad" required>
      <button type="submit">Buscar</button>
    </form>
    <button id="miUbicacion" class="secundario" type="button">📍 Usar mi ubicación</button>

    <div id="favoritos" class="favoritos"></div>

    <div id="resultado">
      <p>Escribe una ciudad para ver su clima.</p>
    </div>
  </div>

  <script>
    const URL_GEOCODING = "https://geocoding-api.open-meteo.com/v1/search";
    const URL_PRONOSTICO = "https://api.open-meteo.com/v1/forecast";
    const URL_NOMBRE_LUGAR = "https://api.bigdatacloud.net/data/reverse-geocode-client";
    const INTERVALO = 5 * 60 * 1000; // 5 minutos
    const MAX_FAVORITOS = 6;
    let temporizador = null;
    const botonTema = document.getElementById("cambiarTema");

    // Traduce el código del clima a texto.
    function descripcion(codigo) {
      if (codigo === 0) return "Despejado";
      if (codigo <= 3) return "Parcialmente nublado";
      if (codigo <= 48) return "Niebla";
      if (codigo <= 57) return "Llovizna";
      if (codigo <= 67) return "Lluvia";
      if (codigo <= 77) return "Nieve";
      if (codigo <= 82) return "Chubascos";
      if (codigo <= 86) return "Nieve con chubascos";
      return "Tormenta";
    }

    function iconoPara(condicion) {
      const iconos = {
        "Despejado": "☀️",
        "Parcialmente nublado": "⛅",
        "Niebla": "🌫️",
        "Llovizna": "🌦️",
        "Lluvia": "🌧️",
        "Chubascos": "🌧️",
        "Nieve": "❄️",
        "Nieve con chubascos": "🌨️",
        "Tormenta": "⛈️"
      };
      return iconos[condicion] || "🌡️";
    }

    // Color del número según la temperatura.
    function colorTemperatura(temperatura) {
      if (temperatura < 18) return "#60a5fa";
      if (temperatura < 26) return "#34d399";
      if (temperatura < 30) return "#fbbf24";
      return "#f87171";
    }

    // Mensaje corto según el clima.
    function mensajePara(datos) {
      const condicion = datos.condicion;
      const temperatura = datos.temperatura;
      if (condicion === "Tormenta") return "⛈️ Hay tormenta, mejor quédate bajo techo.";
      if (["Llovizna", "Lluvia", "Chubascos", "Nieve con chubascos"].includes(condicion)) {
        return "🌂 Lleva paraguas, va a llover.";
      }
      if (temperatura >= 30) return "🕶️ Hace mucho calor, usa bloqueador y toma agua.";
      if (temperatura < 18) return "🧥 Hace fresco, lleva chaqueta.";
      return "😎 Buen clima para salir.";
    }

    function formatearHora(textoHora) {
      const fecha = new Date(textoHora);
      return fecha.toLocaleString("es-CO", {
        day: "numeric",
        month: "short",
        hour: "numeric",
        minute: "2-digit"
      });
    }

    function nombreDia(textoFecha) {
      const fecha = new Date(textoFecha + "T12:00:00");
      return fecha.toLocaleDateString("es-CO", { weekday: "short" });
    }

    // Muestra solo la hora, por ejemplo "3 p. m.".
    function horaCorta(textoHora) {
      const fecha = new Date(textoHora);
      return fecha.toLocaleTimeString("es-CO", { hour: "numeric" });
    }

    // Crea las partículas (gotas o copos) con posiciones y velocidades al azar.
    function animarFondo(condicion) {
      const fondo = document.getElementById("fondo");
      fondo.innerHTML = "";

      const agregar = (clase, estilo = "") => {
        const elemento = document.createElement("div");
        elemento.className = clase;
        elemento.style.cssText = estilo;
        fondo.appendChild(elemento);
      };

      const particulas = (clase, cantidad, minDuracion, maxDuracion) => {
        for (let i = 0; i < cantidad; i++) {
          const duracion = minDuracion + Math.random() * (maxDuracion - minDuracion);
          const retraso = Math.random() * 5;
          agregar(clase, `left: ${Math.random() * 100}%; animation-duration: ${duracion}s; animation-delay: ${retraso}s;`);
        }
      };

      switch (condicion) {
        case "Despejado":
          agregar("sol");
          break;
        case "Parcialmente nublado":
          agregar("sol");
          agregar("nube");
          break;
        case "Niebla":
          agregar("niebla");
          break;
        case "Llovizna":
        case "Lluvia":
        case "Chubascos":
          agregar("nube");
          particulas("gota", 70, 0.8, 1.5);
          break;
        case "Nieve":
        case "Nieve con chubascos":
          agregar("nube");
          particulas("copo", 50, 6, 12);
          break;
        case "Tormenta":
          agregar("nube");
          particulas("gota", 120, 0.6, 1.1);
          agregar("relampago");
          break;
      }
    }

    // Tarjetas de las próximas 12 horas, en una fila que se desliza.
    function horasHTML(horas) {
      const tarjetas = horas.map((h) => `
        <div class="hora">
          <div>${horaCorta(h.hora)}</div>
          <div class="icono-pequeno">${iconoPara(h.condicion)}</div>
          <div><strong>${h.temperatura.toFixed(0)}°</strong></div>
        </div>
      `).join("");
      return `
        <h3 class="titulo-pronostico">Próximas 12 horas</h3>
        <div class="horas">${tarjetas}</div>
      `;
    }

    function pronosticoHTML(pronostico) {
      const tarjetas = pronostico.map((dia) => `
        <div class="dia">
          <div>${nombreDia(dia.fecha)}</div>
          <div class="icono-pequeno">${iconoPara(dia.condicion)}</div>
          <div><strong>${dia.maxima.toFixed(0)}°</strong> / ${dia.minima.toFixed(0)}°</div>
        </div>
      `).join("");
      return `
        <h3 class="titulo-pronostico">Próximos días</h3>
        <div class="pronostico">${tarjetas}</div>
      `;
    }

    function mostrarCargando() {
      document.getElementById("resultado").innerHTML = "<p>Consultando el clima...</p>";
    }

    function mostrarError(mensaje) {
      document.getElementById("resultado").innerHTML = `<p class="error">❌ ${mensaje}</p>`;
    }

    // Pinta el clima en la tarjeta y cambia el fondo.
    function mostrarClima(datos) {
      const lugar = datos.pais ? `${datos.ciudad}, ${datos.pais}` : datos.ciudad;
      document.getElementById("resultado").innerHTML = `
        <h2>${lugar}</h2>
        <div class="icono">${iconoPara(datos.condicion)}</div>
        <div class="temperatura" style="color: ${colorTemperatura(datos.temperatura)}">${datos.temperatura.toFixed(1)} °C</div>
        <p>${datos.condicion}</p>
        <p class="mensaje">${mensajePara(datos)}</p>
        <div class="detalle">
          <div>💧 Humedad<br><strong>${datos.humedad.toFixed(0)} %</strong></div>
          <div>💨 Viento<br><strong>${datos.viento.toFixed(1)} km/h</strong></div>
        </div>
        <p class="actualizado">Actualizado: ${formatearHora(datos.hora)} · se refresca cada 5 min</p>
        ${horasHTML(datos.horas)}
        ${pronosticoHTML(datos.pronostico)}
      `;
      animarFondo(datos.condicion);
    }

    // Pide el clima actual, las horas y los días para unas coordenadas.
    async function obtenerClimaCoordenadas(latitud, longitud) {
      const parametros = new URLSearchParams({
        latitude: latitud,
        longitude: longitud,
        current: "temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code",
        hourly: "temperature_2m,weather_code",
        daily: "weather_code,temperature_2m_max,temperature_2m_min",
        forecast_days: "5",
        timezone: "auto"
      });
      const respuesta = await fetch(URL_PRONOSTICO + "?" + parametros);
      const clima = await respuesta.json();

      // Busca la primera hora que todavía no pasó y toma las 12 siguientes.
      let inicio = clima.hourly.time.findIndex((t) => t >= clima.current.time);
      if (inicio < 0) inicio = 0;
      const horas = clima.hourly.time.slice(inicio, inicio + 12).map((hora, j) => ({
        hora: hora,
        temperatura: clima.hourly.temperature_2m[inicio + j],
        condicion: descripcion(clima.hourly.weather_code[inicio + j])
      }));

      return {
        hora: clima.current.time,
        temperatura: clima.current.temperature_2m,
        humedad: clima.current.relative_humidity_2m,
        viento: clima.current.wind_speed_10m,
        condicion: descripcion(clima.current.weather_code),
        horas: horas,
        pronostico: clima.daily.time.map((fecha, i) => ({
          fecha: fecha,
          condicion: descripcion(clima.daily.weather_code[i]),
          maxima: clima.daily.temperature_2m_max[i],
          minima: clima.daily.temperature_2m_min[i]
        }))
      };
    }

    // Busca una ciudad por nombre y luego pide su clima.
    async function obtenerDatosCiudad(ciudad) {
      const busqueda = new URLSearchParams({
        name: ciudad,
        count: "1",
        language: "es",
        format: "json"
      });
      const respuestaCiudad = await fetch(URL_GEOCODING + "?" + busqueda);
      const datosCiudad = await respuestaCiudad.json();
      if (!datosCiudad.results) {
        throw new Error(`No encontré la ciudad "${ciudad}".`);
      }
      const lugar = datosCiudad.results[0];
      const clima = await obtenerClimaCoordenadas(lugar.latitude, lugar.longitude);
      return { ciudad: lugar.name, pais: lugar.country, ...clima };
    }

    async function consultarClima(ciudad) {
      mostrarCargando();
      try {
        const datos = await obtenerDatosCiudad(ciudad);
        mostrarClima(datos);
        agregarFavorito(datos.ciudad);
      } catch (error) {
        mostrarError("No pude consultar el clima. " + error.message);
      }
    }

    // Obtiene el nombre de la ciudad a partir de las coordenadas.
    async function nombreDeLugar(latitud, longitud) {
      try {
        const parametros = new URLSearchParams({
          latitude: latitud,
          longitude: longitud,
          localityLanguage: "es"
        });
        const respuesta = await fetch(URL_NOMBRE_LUGAR + "?" + parametros);
        const datos = await respuesta.json();
        return {
          ciudad: datos.city || datos.locality || "Tu ubicación",
          pais: datos.countryName || ""
        };
      } catch (e) {
        return { ciudad: "Tu ubicación", pais: "" };
      }
    }

    // Usa la ubicación del navegador para mostrar el clima de donde estás.
    function consultarUbicacion() {
      if (!navigator.geolocation) {
        mostrarError("Tu navegador no permite usar la ubicación.");
        return;
      }
      mostrarCargando();
      navigator.geolocation.getCurrentPosition(
        async (posicion) => {
          try {
            const { latitude, longitude } = posicion.coords;
            const lugar = await nombreDeLugar(latitude, longitude);
            const clima = await obtenerClimaCoordenadas(latitude, longitude);
            mostrarClima({ ciudad: lugar.ciudad, pais: lugar.pais, ...clima });
          } catch (error) {
            mostrarError("No pude consultar el clima. " + error.message);
          }
        },
        () => mostrarError("No pude obtener tu ubicación. Revisa que hayas dado permiso."),
        { timeout: 10000 }
      );
    }

    // Vuelve a consultar cada 5 minutos la misma fuente.
    function programarActualizacion(funcion) {
      clearInterval(temporizador);
      temporizador = setInterval(funcion, INTERVALO);
    }

    // Ciudades favoritas, guardadas en el navegador.
    function cargarFavoritos() {
      try {
        return JSON.parse(localStorage.getItem("favoritos")) || [];
      } catch (e) {
        return [];
      }
    }

    function guardarFavoritos() {
      try {
        localStorage.setItem("favoritos", JSON.stringify(favoritos));
      } catch (e) {}
    }

    let favoritos = cargarFavoritos();

    function agregarFavorito(ciudad) {
      const yaExiste = favoritos.some((c) => c.toLowerCase() === ciudad.toLowerCase());
      if (yaExiste) return;
      favoritos.unshift(ciudad);
      favoritos = favoritos.slice(0, MAX_FAVORITOS);
      guardarFavoritos();
      renderFavoritos();
    }

    function quitarFavorito(ciudad) {
      favoritos = favoritos.filter((c) => c !== ciudad);
      guardarFavoritos();
      renderFavoritos();
    }

    function renderFavoritos() {
      const contenedor = document.getElementById("favoritos");
      contenedor.innerHTML = "";
      favoritos.forEach((ciudad) => {
        const chip = document.createElement("span");
        chip.className = "chip";

        const nombre = document.createElement("span");
        nombre.textContent = ciudad;
        nombre.addEventListener("click", () => {
          document.getElementById("ciudad").value = ciudad;
          consultarClima(ciudad);
          programarActualizacion(() => consultarClima(ciudad));
        });

        const quitar = document.createElement("button");
        quitar.type = "button";
        quitar.className = "quitar";
        quitar.textContent = "✕";
        quitar.addEventListener("click", () => quitarFavorito(ciudad));

        chip.append(nombre, quitar);
        contenedor.appendChild(chip);
      });
    }

    document.getElementById("formulario").addEventListener("submit", (evento) => {
      evento.preventDefault();
      const ciudad = document.getElementById("ciudad").value.trim();
      if (ciudad === "") return;
      consultarClima(ciudad);
      programarActualizacion(() => consultarClima(ciudad));
    });

    document.getElementById("miUbicacion").addEventListener("click", () => {
      consultarUbicacion();
      programarActualizacion(consultarUbicacion);
    });

    // Modo claro y oscuro, recordado en el navegador.
    function aplicarTema(tema) {
      document.body.classList.toggle("claro", tema === "claro");
      botonTema.textContent = tema === "claro" ? "🌙" : "☀️";
      try {
        localStorage.setItem("tema", tema);
      } catch (e) {}
    }

    botonTema.addEventListener("click", () => {
      const esClaro = document.body.classList.contains("claro");
      aplicarTema(esClaro ? "oscuro" : "claro");
    });

    let temaGuardado = "oscuro";
    try {
      temaGuardado = localStorage.getItem("tema") || "oscuro";
    } catch (e) {}
    aplicarTema(temaGuardado);

    renderFavoritos();

    // Permite instalar la página como app en el celular.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
